        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-48.46311517214376,-86.47151778473362],[57.01526813654165,148.964873627827]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleHybrid_0');
        map.getPane('pane_GoogleHybrid_0').style.zIndex = 400;
        var layer_GoogleHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleHybrid_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_GoogleHybrid_0;
        map.addLayer(layer_GoogleHybrid_0);
        function pop_phnloisnbay_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">scalerank</th>\
                        <td>' + (feature.properties['scalerank'] !== null ? autolinker.link(String(feature.properties['scalerank']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">name</th>\
                        <td>' + (feature.properties['name'] !== null ? autolinker.link(String(feature.properties['name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">wikipedia</th>\
                        <td>' + (feature.properties['wikipedia'] !== null ? autolinker.link(String(feature.properties['wikipedia']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Phân loại</th>\
                        <td>' + (feature.properties['phân lo��'] !== null ? autolinker.link(String(feature.properties['phân lo��']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Phân loại quy mô</th>\
                        <td>' + (feature.properties['Quy mô'] !== null ? autolinker.link(String(feature.properties['Quy mô']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Tên nước</th>\
                        <td>' + (feature.properties['tên nư��'] !== null ? autolinker.link(String(feature.properties['tên nư��']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_phnloisnbay_1_0(feature) {
            switch(String(feature.properties['phân lo��'])) {
                case 'Chưa phân loại':
                    return {

                opacity: 1,

                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(90,205,77,1.0)',

            }
                    break;
                case 'Sân bay quốc tế':

                color: 'rgba(35,35,35,1.0)',

                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(22,40,202,1.0)',
                interactive: true,
            }
                    break;
                case 'Sân bay trong nước':
                    return {
                pane: 'pane_phnloisnbay_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,

                fillOpacity: 1,
                fillColor: 'rgba(125,238,227,1.0)',

            }
                    break;
                case 'Sân bay vũ trụ':
                    return {

                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,

                fillColor: 'rgba(214,47,64,1.0)',
                interactive: true,
            }
                    break;
                case 'Trung tâm vũ trụ':
                    return {
                pane: 'pane_phnloisnbay_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(189,71,202,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_phnloisnbay_1');
        map.getPane('pane_phnloisnbay_1').style.zIndex = 401;
        map.getPane('pane_phnloisnbay_1').style['mix-blend-mode'] = 'normal';
        var layer_phnloisnbay_1 = new L.geoJson(json_phnloisnbay_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_phnloisnbay_1',
            layerName: 'layer_phnloisnbay_1',
            pane: 'pane_phnloisnbay_1',
            onEachFeature: pop_phnloisnbay_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_phnloisnbay_1_0(feature));
            },
        });
        var cluster_phnloisnbay_1 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_phnloisnbay_1.addLayer(layer_phnloisnbay_1);

        bounds_group.addLayer(layer_phnloisnbay_1);
        cluster_phnloisnbay_1.addTo(map);
        function pop_imsnbay_2(feature, layer) {
            layer.on({
                mouseout: function(e) {

                mouseover: highlightFeature,

            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">STT</th>\
                        <td>' + (feature.properties['scalerank'] !== null ? autolinker.link(String(feature.properties['scalerank']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">tên sân bay</th>\
                        <td>' + (feature.properties['name'] !== null ? autolinker.link(String(feature.properties['name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\

                    </tr>\
                    <tr>\
                        <th scope="row">Phân loại sân bay</th>\
                        <td>' + (feature.properties['phân lo��'] !== null ? autolinker.link(String(feature.properties['phân lo��']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">quy mô</th>\
                        <td>' + (feature.properties['Quy mô'] !== null ? autolinker.link(String(feature.properties['Quy mô']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Tên quốc gia</th>\
                        <td>' + (feature.properties['tên nư��'] !== null ? autolinker.link(String(feature.properties['tên nư��']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_imsnbay_2_0() {
            return {
                pane: 'pane_imsnbay_2',
                radius: 6.4,
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(65,203,175,1.0)',

        }
        function style_imsnbay_2_1() {
            return {
                pane: 'pane_imsnbay_2',
                radius: 1.4,
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',

                weight: 2.0,

        }
        map.createPane('pane_imsnbay_2');
        map.getPane('pane_imsnbay_2').style.zIndex = 402;
        map.getPane('pane_imsnbay_2').style['mix-blend-mode'] = 'normal';
        var layer_imsnbay_2 = new L.geoJson.multiStyle(json_imsnbay_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_imsnbay_2',
            layerName: 'layer_imsnbay_2',
            pane: 'pane_imsnbay_2',
            onEachFeature: pop_imsnbay_2,
            pointToLayers: [function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_imsnbay_2_0(feature));
            },function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_imsnbay_2_1(feature));
            },
        ]});
        var cluster_imsnbay_2 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_imsnbay_2.addLayer(layer_imsnbay_2);

        bounds_group.addLayer(layer_imsnbay_2);
        cluster_imsnbay_2.addTo(map);
        var osmGeocoder = new L.Control.Geocoder({
            collapsed: true,
            position: 'topleft',
            text: 'Search',
            title: 'Testing'
        }).addTo(map);
        document.getElementsByClassName('leaflet-control-geocoder-icon')[0]
        .className += ' fa fa-search';
        document.getElementsByClassName('leaflet-control-geocoder-icon')[0]
        .title += 'Search for a place';
        var overlaysTree = [
            {label: '<img src="legend/imsnbay_2.png" /> điểm sân bay', layer: cluster_imsnbay_2},
            {label: 'phân loại sân bay<br /><table><tr><td style="text-align: center;"><img src="legend/phnloisnbay_1_Chưaphânloại0.png" /></td><td>Chưa phân loại</td></tr><tr><td style="text-align: center;"><img src="legend/phnloisnbay_1_Sânbayquốctế1.png" /></td><td>Sân bay quốc tế</td></tr><tr><td style="text-align: center;"><img src="legend/phnloisnbay_1_Sânbaytrongnước2.png" /></td><td>Sân bay trong nước</td></tr><tr><td style="text-align: center;"><img src="legend/phnloisnbay_1_Sânbayvũtrụ3.png" /></td><td>Sân bay vũ trụ</td></tr><tr><td style="text-align: center;"><img src="legend/phnloisnbay_1_Trungtâmvũtrụ4.png" /></td><td>Trung tâm vũ trụ</td></tr></table>', layer: cluster_phnloisnbay_1},
            {label: "Google Hybrid", layer: layer_GoogleHybrid_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',

        lay.addTo(map);
        setBounds();
        </script>
